[package]
name = "claude-relay-desktop"
version = "0.1.0"
description = "Claude Code Relay Desktop Application"
authors = ["Claude Relay Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["dialog-open", "dialog-save", "fs-read-file", "fs-write-file", "notification-all", "system-tray", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"

# 引用现有的 relay crates
relay-core = { path = "../crates/relay-core" }
relay-server = { path = "../crates/relay-server" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# This is a standalone package, not part of the parent workspace
[workspace]
